<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="grad_limo_logo_macro_blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Mathematical Continuous Squircle Clip Path -->
    <clipPath id="clip_limo_logo_macro_blue">
      <path d="M 0,256 C 0,55 55,0 256,0 C 457,0 512,55 512,256 C 512,457 457,512 256,512 C 55,512 0,457 0,256 Z"/>
    </clipPath>

    <!-- Gaussian Blur for Ground Contact Shadow -->
    <filter id="blur_limo_logo_macro_blue" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="16"/>
    </filter>
  </defs>

  <!-- Squircle Base Tile -->
  <g clip-path="url(#clip_limo_logo_macro_blue)">
    <!-- Tile Background -->
    <path d="M 0,256 C 0,55 55,0 256,0 C 457,0 512,55 512,256 C 512,457 457,512 256,512 C 55,512 0,457 0,256 Z" fill="url(#grad_limo_logo_macro_blue)"/>

    <!-- Subtle Ambient Surface Sheen -->
    <linearGradient id="sheen_limo_logo_macro_blue" x1="0%" y1="0%" x2="0%" y2="50%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1"/>
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
      </linearGradient>
      <path d="M 0,256 C 0,55 55,0 256,0 C 457,0 512,55 512,256 C 512,457 457,512 256,512 C 55,512 0,457 0,256 Z" fill="url(#sheen_limo_logo_macro_blue)"/>

    <!-- Contact Ground Shadow -->

    <!-- Pure Blobatar Mascot Character -->
    <g transform="translate(-40, 20) scale(5.9)">
      <g transform="translate(0 -1.4)"><g fill="#17b8e7"><circle cx="35.97" cy="49.99" r="22.4"/><circle cx="65.46" cy="49.99" r="22.4"/><path d="M35.97 27.59H65.46V72.4H35.97Z"/></g><g fill="#061116"><path d="M41.53 48.59C40.71 56.41 40.1 57.26 35.67 56.8C31.24 56.33 30.82 55.37 31.64 47.55C32.46 39.73 33.07 38.88 37.5 39.35C41.93 39.81 42.35 40.77 41.53 48.59Z"/><path d="M68.65 48.24C69.09 56.61 68.58 57.61 63.74 57.87C58.89 58.12 58.28 57.18 57.84 48.81C57.4 40.43 57.91 39.44 62.76 39.18C67.6 38.93 68.21 39.87 68.65 48.24Z"/></g></g>
    </g>
  </g>

  <!-- Neo-skeuomorphic Rim Highlight -->
  <path d="M 0,256 C 0,55 55,0 256,0 C 457,0 512,55 512,256 C 512,457 457,512 256,512 C 55,512 0,457 0,256 Z" fill="none" stroke="rgba(255, 255, 255, 0.22)" stroke-width="2"/>
</svg>
