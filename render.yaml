services:
  - type: web
    name: limo-backend
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "pip install -r backend/requirements.txt && python -m playwright install --with-deps chromium"
    startCommand: "python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: LIMO_SURFACE
        value: "web"
      - key: DATABASE_URL
        fromDatabase:
          name: limo-postgres
          property: connectionString
      - key: TURBO_WORKER_URL
        value: "https://turbo.limo-ai.online"
      - key: WORKER_AUTH_TOKEN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: "https://api.limo-ai.online/api/v1/auth/google/callback"
      - key: FRONTEND_URL
        value: "https://app.limo-ai.online"
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"

databases:
  - name: limo-postgres
    plan: free
    databaseName: limo
    user: limo_user
